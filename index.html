<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="21 Jours">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Opération 21 Jours</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : appli de salle — carte « maillot » en tête, anneaux de progression, une vue à la fois, onglets en bas, minuteurs flottants */
:root{
  --bg:#eef2f8; --surface:#ffffff; --raised:#f4f7fc; --ink:#0d1a2e; --muted:#5a6a82; --line:#d5dde9;
  --accent:#1e5eea; --accent-soft:#e2ebfd; --on-accent:#ffffff;
  --energy:#d9500b; --energy-soft:#fde9dd; --good:#128a56; --good-soft:#dcf3e8; --gold:#9a6b06; --gold-soft:#f8edcf;
  --hero1:#0d1a2e; --hero2:#2450b8; --hero-ink:#f2f6fd; --hero-dim:#a9bbdc;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a111d; --surface:#121b2b; --raised:#19253a; --ink:#eaf0fa; --muted:#8c9bb5; --line:#26334a;
  --accent:#5b93ff; --accent-soft:#162748; --on-accent:#08101d;
  --energy:#ff8046; --energy-soft:#3a1d10; --good:#3fd29a; --good-soft:#103024; --gold:#f0c24f; --gold-soft:#3a2e10;
  --hero1:#15233f; --hero2:#2a4fae; --hero-ink:#f2f6fd; --hero-dim:#a9bbdc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111d; --surface:#121b2b; --raised:#19253a; --ink:#eaf0fa; --muted:#8c9bb5; --line:#26334a;
  --accent:#5b93ff; --accent-soft:#162748; --on-accent:#08101d;
  --energy:#ff8046; --energy-soft:#3a1d10; --good:#3fd29a; --good-soft:#103024; --gold:#f0c24f; --gold-soft:#3a2e10;
  --hero1:#15233f; --hero2:#2a4fae; --hero-ink:#f2f6fd; --hero-dim:#a9bbdc; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:10px;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:1.45rem;margin:0;text-transform:uppercase;line-height:1;white-space:nowrap;letter-spacing:.01em}
h1 i{color:var(--accent);font-style:inherit}
.daybadge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:99px;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
main.wrap{padding-block:14px 200px}
.view{display:none;gap:14px}
.view.active{display:grid}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:1.35rem;text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px;text-wrap:balance;line-height:1.1}
h3{font-size:1rem;margin:0;line-height:1.3}
.eyebrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:.85rem}
p{margin:0 0 8px;max-width:65ch} p:last-child{margin-bottom:0}
ul{margin:0;padding-left:18px} li{margin:4px 0}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.progress{height:8px;background:var(--accent-soft);border-radius:99px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.btn{font:600 .95rem var(--f-body);padding:11px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.big{width:100%;font-size:1.05rem;padding:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.good{background:var(--good)} .btn.energy{background:var(--energy)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.off{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.mus{background:var(--raised);color:var(--muted);border:1px solid var(--line)}
/* héro */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;color:var(--hero-ink);
  background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.035) 22px 44px),linear-gradient(135deg,var(--hero1),var(--hero2))}
.hero .eyebrow{color:var(--hero-dim)}
.hero .big{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:4.6rem;line-height:.85;letter-spacing:-.01em}
.hero .big small{font-size:1.6rem;color:var(--hero-dim);font-style:normal;font-weight:600}
.hero .theme{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:1.15rem;letter-spacing:.03em}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:14px}
.dots span{height:8px;border-radius:3px;background:rgba(255,255,255,.14)}
.dots .d2{background:var(--hero-ink)} .dots .d1{background:rgba(255,255,255,.5)} .dots .d0{background:rgba(255,255,255,.26)}
.dots .now{outline:2px solid var(--energy);outline-offset:1px}
.coachmsg{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.09);border-radius:12px;padding:10px 12px;margin-top:14px;font-size:.9rem}
.coachmsg b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:.8rem;color:var(--hero-dim);white-space:nowrap;padding-top:2px}
/* anneaux */
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ring{display:grid;justify-items:center;gap:2px;text-align:center;min-width:0}
.ring svg{width:100%;max-width:78px;height:auto}
.ring .rv{font-family:var(--f-mono);font-size:.82rem;font-weight:600}
.ring .rl{font-size:.7rem;color:var(--muted)}
.ring text{font-family:var(--f-mono);font-weight:600;font-size:15px;fill:var(--ink)}
/* formulaires */
.checks{display:grid;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.checks input{width:22px;height:22px;flex:none;accent-color:var(--good);margin-top:1px}
.checks label:has(input:checked){border-color:var(--good);background:var(--good-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:grid;gap:4px;flex:1 1 120px;min-width:0}
.field label,.flabel{font-size:.78rem;color:var(--muted);font-weight:600}
input[type=number],input[type=date],input[type=text],select,textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--ink);width:100%;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;font:600 .82rem var(--f-body);padding:8px 4px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat .v{font-family:var(--f-mono);font-size:1.2rem;font-variant-numeric:tabular-nums;font-weight:600}
.stat .l{font-size:.74rem;color:var(--muted)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.item.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.item .t{font-weight:600}
details{border-top:1px solid var(--line)} details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--muted);font-family:var(--f-mono)}
details[open]>summary::after{content:"−"}
details .body{padding:0 0 14px;display:grid;gap:8px;font-size:.92rem}
.note{border-left:3px solid var(--energy);padding:6px 12px;font-size:.88rem;color:var(--muted)}
/* séance */
.sess-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 45px);z-index:4;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sess-bar .mono{font-size:1.3rem;font-weight:600}
.ex{display:grid;gap:8px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sugg{font-size:.85rem;padding:7px 10px;border-radius:8px;background:var(--raised);color:var(--muted)}
.sugg.up{background:var(--good-soft);color:var(--good);font-weight:600}
.tech{border:0} .tech summary{padding:2px 0;font-size:.85rem;color:var(--accent);justify-content:flex-start}
.tech summary::after{content:""} .tech .body{padding:6px 0 2px;font-size:.88rem}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 50px;gap:8px;align-items:center}
.setrow .n{font-family:var(--f-mono);color:var(--muted);text-align:center}
.unit{position:relative}
.unit span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--muted);pointer-events:none}
.unit input{padding-right:36px}
.setbtn{height:42px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--muted);font-size:1.1rem;cursor:pointer}
.setrow.done .setbtn{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.setrow.done input{border-color:var(--good)}
.setrow.pr .setbtn{background:var(--gold);border-color:var(--gold)}
/* nutrition */
.mbar{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.mbar .progress span.p{background:var(--good)} .mbar .progress span.e{background:var(--energy)}
.step{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.step:first-of-type{border-top:0}
.step input{width:22px;height:22px;accent-color:var(--good);margin-top:2px}
.step:has(input:checked) .txt{color:var(--muted);text-decoration:line-through}
.step .btn{margin-top:8px}
.shop{list-style:none;margin:0;padding:0}
.shop li{border-bottom:1px dashed var(--line);margin:0}
.shop li:last-child{border-bottom:0}
.shop label{display:flex;gap:10px;align-items:center;padding:11px 0;cursor:pointer}
.shop input{width:22px;height:22px;flex:none;accent-color:var(--good)}
.shop .nm{flex:1;min-width:0}
.shop label:has(input:checked) .nm{text-decoration:line-through;color:var(--muted)}
.water{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.water .mono{font-size:1.3rem;flex:1;white-space:nowrap}
/* graphiques */
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.readout{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);min-height:1.4em}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.dot{width:8px;height:8px;border:0;border-radius:50%;background:var(--muted)}
.legend i.dash{border-top:2px dashed var(--muted)}
/* minuteurs */
#dock{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:8;pointer-events:none}
#dock .wrap{display:grid;gap:6px;padding-block:6px}
.tm{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;background:var(--hero1);color:var(--hero-ink);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 10px 10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.tm .lab{flex:1;min-width:0;font-size:.85rem;line-height:1.25;background:none;border:0;color:inherit;text-align:left;font:inherit;cursor:pointer;padding:0}
.tm .lab b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem}
.tm .lab span{opacity:.7;font-size:.76rem}
.tm .time{font-family:var(--f-mono);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.tm .tb{font:600 .8rem var(--f-body);height:36px;min-width:36px;padding:0 10px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;cursor:pointer}
.tm .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--energy)}
.tm.done{background:var(--good);color:var(--on-accent)}
#focus{position:fixed;inset:0;z-index:20;background:var(--hero1);color:var(--hero-ink);display:grid;place-items:center;padding:24px;text-align:center}
#focus.hot{background:var(--energy)}
#focus .fx{display:grid;gap:14px;justify-items:center;width:100%;max-width:340px}
#focus svg{width:min(72vw,300px);height:auto}
#focus text{font-family:var(--f-mono);font-weight:600;fill:currentColor}
#focus .ph{font-family:var(--f-display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:2.4rem;line-height:1}
#focus .btn{background:rgba(255,255,255,.14);color:inherit;border:1px solid rgba(255,255,255,.35)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;background:var(--gold);color:var(--hero1);font-weight:700;padding:9px 16px;border-radius:14px;font-size:.88rem;box-shadow:0 6px 18px rgba(0,0,0,.3);width:max-content;max-width:88vw;text-align:center}
/* onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);padding-left:max(2px,env(safe-area-inset-left,0px));padding-right:max(2px,env(safe-area-inset-right,0px))}
nav.tabs button{font:600 .66rem var(--f-body);background:none;border:0;color:var(--muted);padding:6px 0;height:60px;cursor:pointer;display:grid;gap:3px;justify-items:center;align-content:center;min-width:0}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button[aria-selected="true"] svg{stroke-width:2.3}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top"><div class="wrap"><h1>Opération <i>21</i> jours</h1><span class="daybadge" id="badge"></span></div></header>
<main class="wrap">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-train"></section>
  <section class="view" id="v-food"></section>
  <section class="view" id="v-shop"></section>
  <section class="view" id="v-track"></section>
  <section class="view" id="v-coach"></section>
</main>
<div id="toast" hidden></div>
<div id="dock"><div class="wrap" id="dockin"></div></div>
<div id="focus" hidden></div>
<nav class="tabs"><div class="wrap" role="tablist">
  <button role="tab" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button role="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Séance</button>
  <button role="tab" data-tab="food"><svg viewBox="0 0 24 24"><path d="M4 11h16v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 11h20M9 4v3M15 4v3"/></svg>Repas</button>
  <button role="tab" data-tab="shop"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10L20 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>Courses</button>
  <button role="tab" data-tab="track"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 15l4-5 4 3 6-8"/></svg>Suivi</button>
  <button role="tab" data-tab="coach"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>Coach</button>
</div></nav>

<script>
(function(){
"use strict";
/* ================= utilitaires ================= */
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem('op21_'+k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem('op21_'+k,JSON.stringify(v))}catch(e){}}};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);
const frLong=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const frShort=s=>new Date(s+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const nf=(n,d=1)=>Number(n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const kg=n=>nf(n,n%1?1:0);
const n0=n=>Math.round(n).toLocaleString('fr-FR');
const fmt=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=id=>{const el=$(id);return el?parseFloat(el.value):NaN};

/* ================= état ================= */
let start=store.get('start',null); if(!start){start=today();store.set('start',start)}
let profile=store.get('profile',{h:190,age:28,w0:store.get('startw',106),act:1.5});
let checks=store.get('checks',{});      // par date : repas cochés, extras, eau, pas, habitudes
let wlog=store.get('wlog',{});          // séances
let active=store.get('active',null);
let log=store.get('log',[]);            // check-in du matin : poids, sommeil, énergie, courbatures
let meas=store.get('meas',[]);          // mensurations
let shopDone=store.get('shop',{}),shopExtra=store.get('shopx',[]);
let cookDone=store.get('cook',{});
let timers=store.get('timers',[]).filter(t=>!t.done||Date.now()-t.doneAt<36e5);

let ac=null;
function initAudio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(n){
  try{if(navigator.vibrate)navigator.vibrate(n>1?[250,120,250,120,400]:200)}catch(e){}
  if(!sound||!ac)return;
  try{for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*.38;
    o.frequency.value=n>1?880:660;o.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.start(t);o.stop(t+.32)}}catch(e){}
}
document.addEventListener('pointerdown',initAudio);
let toastT=null;
function toast(m){const el=$('toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3200)}

/* ================= minuteurs ================= */
let dockSig='';
function startTimer(id,label,phases,auto){
  initAudio();timers=timers.filter(t=>t.id!==id);
  timers.push({id,label,phases,i:0,end:Date.now()+phases[0][1]*1000,done:false,auto:!!auto});
  store.set('timers',timers);renderDock();
}
function stopTimer(id){timers=timers.filter(t=>t.id!==id);if(focusId===id)focusId=null;store.set('timers',timers);renderDock()}
function tick(){
  const now=Date.now();let changed=false;
  timers.forEach(t=>{while(!t.done&&now>=t.end){changed=true;
    if(t.i<t.phases.length-1){t.i++;t.end+=t.phases[t.i][1]*1000;if(now-t.end<1500)beep(1)}
    else{t.done=true;t.doneAt=t.end;if(now-t.end<3000)beep(3)}}});
  const n=timers.length;
  timers=timers.filter(t=>!(t.done&&t.auto&&now-t.doneAt>10000));
  if(changed||n!==timers.length)store.set('timers',timers);
  renderDock();
  const el=$('sess-time');if(el&&active)el.textContent=fmt((now-active.t0)/1000);
}
function renderDock(){
  const now=Date.now();
  const sig=timers.map(t=>t.id+':'+t.i+':'+(t.done?1:0)).join('|')+'#'+focusId;
  if(sig!==dockSig){dockSig=sig;
    $('dockin').innerHTML=timers.map(t=>{const ph=t.phases[t.i];
      const sb=t.done?'Terminé':(t.phases.length>1?esc(ph[0])+' · '+(t.i+1)+'/'+t.phases.length:(ph[0]!==t.label?esc(ph[0]):'Touche pour agrandir'));
      return `<div class="tm ${t.done?'done':''}"><button class="lab" type="button" data-act="t-focus" data-id="${t.id}"><b>${esc(t.label)}</b><span>${sb}</span></button><span class="time" id="tt-${t.id}"></span>${t.done?'':`<button class="tb" type="button" data-act="t-add" data-id="${t.id}">+30 s</button>`}<button class="tb" type="button" data-act="t-x" data-id="${t.id}" aria-label="Arrêter">✕</button><span class="bar" id="tb-${t.id}"></span></div>`}).join('');
    const f=timers.find(t=>t.id===focusId),F=$('focus');
    if(!f){focusId=null;F.hidden=true}
    else{const ph=f.phases[f.i];F.hidden=false;F.classList.toggle('hot',!f.done&&/fort/i.test(ph[0]));
      F.innerHTML=`<div class="fx"><div class="eyebrow" style="color:inherit;opacity:.75">${esc(f.label)}${f.phases.length>1?' · '+(f.i+1)+' / '+f.phases.length:''}</div>
      <div class="ph">${f.done?'Terminé':esc(ph[0])}</div>
      <svg viewBox="0 0 200 200" role="img" aria-label="Temps restant"><circle cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="10"/><circle id="fring" cx="100" cy="100" r="88" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-dasharray="553" transform="rotate(-90 100 100)"/><text id="ftime" x="100" y="116" text-anchor="middle" font-size="46"></text></svg>
      <div class="row" style="justify-content:center">${f.done?'':`<button class="btn" type="button" data-act="t-add" data-id="${f.id}">+30 s</button>`}<button class="btn" type="button" data-act="t-unfocus">Réduire</button><button class="btn" type="button" data-act="t-x" data-id="${f.id}">Arrêter</button></div></div>`}
  }
  timers.forEach(t=>{const rem=t.done?0:(t.end-now)/1000,dur=t.phases[t.i][1],fr=Math.max(0,Math.min(1,rem/dur));
    const el=$('tt-'+t.id);if(el)el.textContent=fmt(rem);
    const b=$('tb-'+t.id);if(b)b.style.width=(t.done?0:fr*100)+'%';
    if(t.id===focusId){const r=$('fring'),x=$('ftime');if(r)r.setAttribute('stroke-dashoffset',553*(1-fr));if(x)x.textContent=fmt(rem)}});
}

const nSets=(ex,w)=>ex.sets||WEEKS[w].sets;
const range=r=>{const m=String(r).match(/(\d+)(?:\D+(\d+))?/);return m?[+m[1],+(m[2]||m[1])]:[0,0]};
const e1rm=(w,r)=>w*(1+r/30);
const doneSets=a=>Array.isArray(a)?a.filter(x=>x&&x.d):[];
const exName=(ex,cyc)=>(cyc%2===1&&ex.v)?ex.v:ex.n;
const nmOf=(s,e)=>(s.names&&s.names[e])||DAYS[s.d].ex[e].n;
function lastSession(d,e,name){
  const ks=Object.keys(wlog).filter(k=>wlog[k].d===d&&wlog[k].date<today()).sort().reverse();
  for(const k of ks){const s=wlog[k];if(nmOf(s,e)!==name)continue;const a=doneSets((s.sets||{})[e]);if(a.length)return a}
  return null;
}
function suggest(d,e,name,w){
  const ex=DAYS[d].ex[e];
  if(WEEKS[w].deload)return {w:null,r:null,up:false,msg:"Semaine de décharge : 2 séries, garde la charge habituelle et arrête-toi bien avant l'échec."};
  const a=lastSession(d,e,name);if(!a)return null;
  const ws=a.map(x=>x.w||0),wmax=Math.max(...ws),[lo,hi]=range(ex.r);
  const top=a.filter(x=>(x.w||0)===wmax);
  if(!wmax)return {w:null,r:Math.max(...a.map(x=>x.r||0)),up:false,msg:`Dernière fois : ${a.map(x=>x.r||'?').join(' / ')} reps. Bats-le d'une rep.`};
  if(hi&&a.every(x=>(x.r||0)>=hi))return {w:wmax+(ex.inc||2.5),r:lo,up:true,msg:`Tu as validé ${hi} reps partout à ${kg(wmax)} kg : monte à ${kg(wmax+(ex.inc||2.5))} kg.`};
  return {w:wmax,r:top[0].r,up:false,msg:`Dernière fois : ${kg(wmax)} kg × ${a.map(x=>x.r||'?').join(' / ')}. Garde la charge, vise +1 rep.`};
}
function bestE1(name,exceptKey){
  let b=0;Object.keys(wlog).forEach(k=>{if(k===exceptKey)return;const s=wlog[k];DAYS[s.d].ex.forEach((ex,e)=>{if(nmOf(s,e)!==name)return;
    doneSets((s.sets||{})[e]).forEach(x=>{if(x.w&&x.r)b=Math.max(b,e1rm(x.w,x.r))})})});return b;
}

function drawChart(tr){

  const target=profile.w0-4,showT=base===0;
  const vals=pts.map(o=>o.w).concat(showT?[profile.w0,target]:[profile.w0]);
  const lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
  const X=d=>p.l+d/(days-1)*(W-p.l-p.r),Y=v=>p.t+(hi-v)/(hi-lo)*(H-p.t-p.b);
  let g='';
  for(let v=lo;v<=hi;v+=Math.max(1,Math.round((hi-lo)/5)))g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${p.l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  [0,7,14,20].forEach(d=>{g+=`<text x="${X(d)}" y="${H-6}" text-anchor="middle">J${base+d+1}</text>`});
  if(showT)g+=`<line x1="${X(0)}" y1="${Y(profile.w0)}" x2="${X(20)}" y2="${Y(target)}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/>`;
  if(pts.length){const line=pts.map((o,i)=>(i?'L':'M')+X(o.d)+' '+Y(o.t)).join(' ');
    g+=`<path d="${line} L${X(pts[pts.length-1].d)} ${H-p.b} L${X(pts[0].d)} ${H-p.b} Z" fill="var(--accent-soft)" fill-opacity=".55"/>`;
    pts.forEach(o=>{g+=`<circle cx="${X(o.d)}" cy="${Y(o.w)}" r="3.5" fill="var(--muted)" stroke="var(--surface)" stroke-width="2"/>`});
    g+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    const l=pts[pts.length-1];g+=`<circle cx="${X(l.d)}" cy="${Y(l.t)}" r="5.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
    g+=`<line id="xh" x1="0" x2="0" y1="${p.t}" y2="${H-p.b}" stroke="var(--muted)" stroke-dasharray="2 3" visibility="hidden"/>`}
  else g+=`<text x="${W/2}" y="${H/2-24}" text-anchor="middle">Ta courbe apparaît après ta première pesée</text>`;
  $('chart').innerHTML=`<div class="tablebox"><svg id="wsvg" class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Courbe de poids" style="touch-action:pan-y">${g}</svg></div>`;
  const svg=$('wsvg');if(!pts.length)return;
  const mv=ev=>{const r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W;
    const o=pts.reduce((b,q)=>Math.abs(X(q.d)-x)<Math.abs(X(b.d)-x)?q:b);
    const xh=$('xh');xh.setAttribute('x1',X(o.d));xh.setAttribute('x2',X(o.d));xh.setAttribute('visibility','visible');
    $('readout').textContent=`Jour ${o.d+base+1} · pesée ${nf(o.w)} kg · tendance ${nf(o.t)} kg`};
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);
}

function weekStats(i){
  const a=addDays(start,7*i),b=addDays(start,7*i+6),inr=d=>d>=a&&d<=b;
  const ws=log.filter(x=>x.w!=null&&inr(x.date)),ss=log.filter(x=>x.s!=null&&inr(x.date)),T=targets();
  let prot=0,logged=0;for(let d=0;d<7;d++){const dt=addDays(a,d),t=totals(dt);if(t.k>0){logged++;if(t.p>=.9*T.p)prot++}}
  return {a,b,avg:ws.length?ws.reduce((q,x)=>q+x.w,0)/ws.length:null,n:ws.length,
    sleep:ss.length?ss.reduce((q,x)=>q+x.s,0)/ss.length:null,
    sess:Object.values(wlog).filter(s=>s.done&&!DAYS[s.d].light&&inr(s.date)).length,prot,logged};
}
function verdict(i,S,prev){
  if(S.avg==null||S.n<3)return ["off","Pas assez de pesées","Il faut au moins 3 pesées dans la semaine pour juger. Pèse-toi chaque matin."];
  const loss=prev-S.avg,pct=loss/prev*100;
  if(i===0){return loss>=1?["ok","Bon départ",`−${nf(loss)} kg en moyenne. Une bonne partie est de l'eau et du glycogène : c'est exactement ce que tu voulais évacuer. La suite sera plus lente, c'est normal.`]:["gold","Départ lent",`−${nf(Math.max(0,loss))} kg. Vérifie trois choses : le sel caché (pain, conserves en sauce, fromage), les 10 000 pas, et que tu ne manges rien hors journal.`]}
  if(loss<.3)return ["gold","Ça stagne",`${loss>=0?'−':'+'}${nf(Math.abs(loss))} kg sur la semaine. Retire 40 g de riz cru par jour (−150 kcal) et ajoute 2 000 pas. Si ton tour de taille baisse quand même, ne change rien : c'est de l'eau.`];
  if(pct>1.3)return ["gold","Trop rapide",`−${nf(loss)} kg, soit ${nf(pct)} % de ton poids en une semaine. Au-delà de 1 %, tu risques de perdre du muscle. Ajoute 40 g de riz cru par jour.`];
  return ["ok","Dans la cible",`−${nf(loss)} kg (${nf(pct)} % du poids). C'est le rythme qui fait fondre le gras en gardant le muscle. Ne change rien.`];
}

 ["Manger dehors sans tout casser",`<ul><li><b>Kebab</b> : assiette viande + salade + sauce blanche à part, sans frites, ou sandwich sans frites. Un sandwich complet, c'est environ 800 kcal : retire ton riz et tes pommes de terre du jour.</li><li><b>Fast-food</b> : deux burgers simples, pas de frites, boisson zéro. Environ 500 à 600 kcal et 30 g de protéines.</li><li><b>Boulangerie</b> : sandwich poulet crudités sans mayo, pas de viennoiserie.</li><li><b>Chez des amis</b> : double portion de viande et de légumes, une seule de féculents, pas de pain.</li></ul><p>Note-le dans le journal (catégorie Écarts) et reprends le plan au repas suivant. Un écart ne ruine rien, c'est l'abandon qui ruine.</p>`],

  else if(t.id==='steps'){dayChecks().steps=Math.max(0,parseInt(t.value)||0);saveChecks();renderHome()}
  else if(t.id==='af-id')afLabel();
  else if(t.id==='startd'&&t.value){start=t.value;store.set('start',start);renderCoach()}
  else if(['p-h','p-age','p-w0','p-act'].includes(t.id)){const v=parseFloat(t.value);if(v>0){profile[t.id.slice(2)]=v;store.set('profile',profile);renderCoach()}}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='qe')$('qe-v').textContent=t.value;
  else if(t.id==='qo')$('qo-v').textContent=t.value;
  if(!t.dataset.f||!active)return;
  const S=wlog[active.key],e2=+t.dataset.e,s=+t.dataset.s;
  if(!Array.isArray(S.sets[e2]))S.sets[e2]=[];const v=S.sets[e2][s]=S.sets[e2][s]||{};
  v[t.dataset.f]=t.value===''?null:+t.value;store.set('wlog',wlog);
  if(e2===0&&s===0)warmup();
});
document.addEventListener('submit',e=>{
  e.preventDefault();const id=e.target.id;
  if(id==='checkin'){const w=num('qw'),s=num('qs');if(isNaN(w)){$('qw').focus();return}addLog(today(),{w,s,en:+$('qe').value,so:+$('qo').value});renderHome();window.scrollTo(0,0)}
  else if(id==='logform'){const w=num('lweight'),s=num('lsleep'),dt=$('ldate').value;if(!dt||(isNaN(w)&&isNaN(s)))return;addLog(dt,{w,s});renderTrack()}
  else if(id==='measform'){const dt=$('m-date').value,waist=num('m-waist');if(!dt||isNaN(waist))return;const o={date:dt,waist,neck:num('m-neck')||null,arm:num('m-arm')||null};
    const old=meas.find(x=>x.date===dt);if(old&&!o.neck)o.neck=old.neck;if(!o.neck&&meas.length)o.neck=meas[meas.length-1].neck;
    meas=meas.filter(x=>x.date!==dt);meas.push(o);meas.sort((a,b)=>a.date<b.date?-1:1);store.set('meas',meas);renderTrack()}
  else if(id==='addfood'){const k=$('af-id').value,F=FOODS[k];let q=num('af-q');if(isNaN(q)||q<=0)q=F.u?1:100;const c=dayChecks();c.x=c.x||[];c.x.push([k,F.u?q*F.u:q]);saveChecks();renderFood()}
  else if(id==='shopadd'){const v=$('shopx').value.trim();if(!v)return;shopExtra.push(v);store.set('shopx',shopExtra);renderShop()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(active)wake()}});

if(active&&!wlog[active.key]){active=null;store.set('active',null)}
show(tab);
setInterval(tick,250);
try{if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
